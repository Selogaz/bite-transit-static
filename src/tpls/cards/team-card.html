<li class="team-card swiper-slide">
  <div class="team-card__media media">
    <picture class="media__pic">
      <img class="media__img" src="@img/team.bit/@@photo" alt="@@alt" width="224" height="268" loading="lazy">
    </picture>
  </div>

  <p class="team-card__name">@@name</p>
  @@if (typeof role != 'undefined') {
    <p class="team-card__role">@@role</p>
  }
</li>
