<li class="video-card swiper-slide">
  <button class="video-card__media media media--cover" type="button" aria-label="Смотреть видео @@number">
    <picture class="media__pic">
      <img class="media__img" src="@img/videos.bit/@@image" alt="" loading="lazy">
    </picture>
    <img class="video-card__play" src="@img/videos.bit/icon-play.svg" alt="" width="68" height="48">
  </button>
</li>
